site_name: Cristiano Ronaldo
site_description: Сайт о Криштиану Роналду
site_author: Мацуков Артём
site_url: https://durilich.github.io/2025_2026-introduction-in-web-tech-u4225-matsukov_a_s/

theme:
  name: material
  language: ru
  logo: images/logo.svg
  favicon: images/logo.svg
  palette:
    primary: red
    accent: amber
  features:
    - navigation.tabs
    - search.highlight

nav:
  - Главная: index.md
  - О нём: about.md
  - Проекты: projects.md
  - Контакты: contacts.md

plugins:
  - search

markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true
